# Only Us — Build APK in the cloud (no Android Studio / VS Code needed)
#
# How it works: GitHub Actions downloads the verified v1.3 project ZIP,
# builds the APK on GitHub's servers, and publishes it as a release.
# Trigger: Actions tab -> "Build APK" -> Run workflow. (Also runs on
# every push to main that touches this workflow file.)
#
# The ZIP is the verified v1.3 source (flutter analyze 0 issues,
# flutter test 70/70). It contains no real google-services.json, so
# Firebase features show the "not configured yet" screen until the
# real file is supplied as the GOOGLE_SERVICES_JSON secret.
# NOTE: the ZIP link below is a temporary file link (expires 2026-11-27).
# If it has expired when you re-run this workflow, re-upload the ZIP
# and update the URL.
#
# OPTIONAL secret (add it later for a fully working Firebase build):
#   GOOGLE_SERVICES_JSON — base64 of android/app/google-services.json
#   (the real Firebase file — it is git-ignored, so the workflow needs
#   it as a secret). Without this secret the build still succeeds with
#   a clearly-marked placeholder file.
#
# OPTIONAL secrets (only for a properly signed release APK):
#   ANDROID_KEYSTORE_BASE64, KEYSTORE_PASSWORD, KEY_PASSWORD, KEY_ALIAS
#   Without these, the APK is debug-signed (fine for testing on your
#   two phones).
#
# Download: Releases page -> the "Only Us APK" release -> app-release.apk.
# Install: send the APK to the phone, allow "Install unknown apps",
# install. Both partners sign in with their Firebase accounts.

name: Build APK

permissions:
  contents: write

on:
  workflow_dispatch:
  push:
    branches: [main]
    paths:
      - '.github/workflows/build-apk.yml'

jobs:
  build-apk:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Download verified project ZIP
        run: |
          curl -sL -o only-us.zip "https://muse.ai/files/1437332169470928/2557381038119332/fhinuxn4t6b03fd2lulezb8x/Only_Us_Flutter_Project_v1.3.zip"
          test -s only-us.zip
          unzip -o only-us.zip -d build-src
          test -f build-src/only-us/pubspec.yaml
          echo "Project ZIP unpacked."

      - name: Set up Java 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: Set up Flutter
        uses: subosito/flutter-action@v2
        with:
          flutter-version: '3.35.x'
          channel: stable

      - name: Restore google-services.json from secret (or placeholder)
        working-directory: build-src/only-us
        env:
          GOOGLE_SERVICES_JSON: ${{ secrets.GOOGLE_SERVICES_JSON }}
        run: |
          if [ -n "$GOOGLE_SERVICES_JSON" ]; then
            echo "$GOOGLE_SERVICES_JSON" | base64 -d > android/app/google-services.json
            test -s android/app/google-services.json
            echo "Real google-services.json restored from secret."
          else
            echo "::warning::No GOOGLE_SERVICES_JSON secret — building with a placeholder file. The APK will compile, but Firebase features need the real file."
            cp android/app/google-services.json.example android/app/google-services.json
            test -s android/app/google-services.json
          fi

      - name: Restore Gradle wrapper jar (binary, not stored in repo)
        working-directory: build-src/only-us
        run: |
          if [ ! -s android/gradle/wrapper/gradle-wrapper.jar ]; then
            mkdir -p android/gradle/wrapper
            curl -sL -o android/gradle/wrapper/gradle-wrapper.jar https://raw.githubusercontent.com/gradle/gradle/v8.9.0/gradle/wrapper/gradle-wrapper.jar
            test -s android/gradle/wrapper/gradle-wrapper.jar
            echo "Gradle wrapper jar restored."
          fi

      - name: Restore release keystore from secrets (optional)
        working-directory: build-src/only-us
        env:
          KEYSTORE_B64: ${{ secrets.ANDROID_KEYSTORE_BASE64 }}
          KEYSTORE_PASSWORD: ${{ secrets.KEYSTORE_PASSWORD }}
          KEY_PASSWORD: ${{ secrets.KEY_PASSWORD }}
          KEY_ALIAS: ${{ secrets.KEY_ALIAS }}
        run: |
          if [ -n "$KEYSTORE_B64" ]; then
            echo "$KEYSTORE_B64" | base64 -d > android/only-us-release.keystore
            cat > android/key.properties <<EOF
          storePassword=$KEYSTORE_PASSWORD
          keyPassword=$KEY_PASSWORD
          keyAlias=$KEY_ALIAS
          storeFile=only-us-release.keystore
          EOF
            echo "Release keystore restored — signed release build."
          else
            echo "No keystore secrets — building debug-signed APK for testing."
          fi

      - name: Install dependencies
        working-directory: build-src/only-us
        run: flutter pub get

      - name: Analyze
        working-directory: build-src/only-us
        run: flutter analyze --no-fatal-warnings --no-fatal-infos

      - name: Test
        working-directory: build-src/only-us
        run: flutter test

      - name: Build APK (release)
        working-directory: build-src/only-us
        run: flutter build apk --release

      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: only-us-apk
          path: build-src/only-us/build/app/outputs/flutter-apk/app-release.apk
          if-no-files-found: error

      - name: Publish APK as a release
        uses: softprops/action-gh-release@v2
        with:
          tag_name: apk-${{ github.run_number }}
          name: Only Us APK (build ${{ github.run_number }})
          body: Debug-signed APK built from main. Install on both phones and sign in with the two Firebase accounts.
          files: build-src/only-us/build/app/outputs/flutter-apk/app-release.apk
