name: only_us
description: "Only Us 💕 — a private Flutter Android messenger for exactly two people. No games, no ads, no analytics."
publish_to: "none"
version: 1.0.0+1

environment:
  sdk: ^3.9.0
  flutter: ">=3.35.0"

dependencies:
  flutter:
    sdk: flutter
  firebase_core: ^4.2.0
  firebase_auth: ^6.1.0
  cloud_firestore: ^6.1.0
  cloud_functions: ^6.1.0
  firebase_storage: ^13.0.0
  firebase_messaging: ^16.0.0
  flutter_local_notifications: ^19.5.0
  provider: ^6.1.5
  flutter_webrtc: ^0.12.8
  flutter_nearby_connections: ^1.1.2
  record: ^6.1.1
  just_audio: ^0.10.5
  image_picker: ^1.2.0
  file_picker: ^10.3.2
  video_player: ^2.10.0
  cached_network_image: ^3.4.1
  emoji_picker_flutter: ^4.3.0
  permission_handler: ^12.0.1
  shared_preferences: ^2.5.3
  path_provider: ^2.1.5
  path: ^1.9.1
  sqflite: ^2.4.2
  flutter_secure_storage: ^9.2.4
  encrypt: ^5.0.3
  connectivity_plus: ^7.0.0
  crypto: ^3.0.7

dev_dependencies:
  flutter_test:
    sdk: flutter
  integration_test:
    sdk: flutter
  flutter_lints: ^6.0.0

flutter:
  uses-material-design: true
  assets:
    - assets/images/
